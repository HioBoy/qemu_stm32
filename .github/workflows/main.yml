# 工作流名称
name: Cross-Platform Build (Windows & Linux)

# 触发条件：push到main分支、pull request到main分支、手动触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 手动触发

# 定义作业：同时在Windows和Linux上运行
jobs:
  build:
    # 运行的操作系统
    runs-on: ${{ matrix.os }}
    # 矩阵配置：指定要编译的系统
    strategy:
      fail-fast: false # 一个系统编译失败不影响另一个
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # 步骤1：拉取代码到构建环境（先尝试拉取子模块）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false # 先禁用自动拉取，后续手动修复后再拉取
          fetch-depth: 0    # 拉取完整提交历史，避免子模块关联失败

      # 步骤2：修复QEMU子模块地址（核心解决git.qemu-project.org连接拒绝+Windows路径问题）
      - name: Fix QEMU submodule URL (with retry)
        run: |
          # 修复Windows路径转义问题，使用原生环境变量GITHUB_WORKSPACE
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          echo "Current workspace: $WORKSPACE_DIR"
          
          # 检查路径是否存在
          if [ ! -d "$WORKSPACE_DIR" ]; then
            echo "Error: Workspace directory $WORKSPACE_DIR does not exist!"
            exit 1
          fi
          
          # 进入工作目录（兼容Windows/Linux）
          cd "$WORKSPACE_DIR" || exit 1
          
          # 批量替换所有子模块地址（覆盖所有git.qemu-project.org和anongit.freedesktop.org）
          if [ -f .gitmodules ]; then
            # 替换 git.qemu-project.org 为 GitHub 镜像
            sed -i 's|git://git.qemu-project.org/\(.*\)|https://github.com/qemu/\1|g' .gitmodules
            # 替换 anongit.freedesktop.org/pixman 为 GitHub 镜像
            sed -i 's|git://anongit.freedesktop.org/pixman|https://github.com/freedesktop/pixman.git|g' .gitmodules
            # 移除末尾多余的 /（部分原地址有尾斜杠）
            sed -i 's|.git/$|.git|g' .gitmodules
          else
            # 如果没有.gitmodules，创建基础版本（包含所有子模块）
            cat > .gitmodules << EOF
[submodule "roms/vgabios"]
	path = roms/vgabios
	url = https://github.com/qemu/vgabios.git
[submodule "roms/seabios"]
	path = roms/seabios
	url = https://github.com/qemu/seabios.git
[submodule "roms/SLOF"]
	path = roms/SLOF
	url = https://github.com/qemu/SLOF.git
[submodule "roms/ipxe"]
	path = roms/ipxe
	url = https://github.com/qemu/ipxe.git
[submodule "roms/openbios"]
	path = roms/openbios
	url = https://github.com/qemu/openbios.git
[submodule "roms/openhackware"]
	path = roms/openhackware
	url = https://github.com/qemu/openhackware.git
[submodule "roms/qemu-palcode"]
	path = roms/qemu-palcode
	url = https://github.com/rth7680/qemu-palcode.git
[submodule "roms/sgabios"]
	path = roms/sgabios
	url = https://github.com/qemu/sgabios.git
[submodule "pixman"]
	path = pixman
	url = https://github.com/freedesktop/pixman.git
[submodule "dtc"]
	path = dtc
	url = https://github.com/qemu/dtc.git
[submodule "roms/u-boot"]
	path = roms/u-boot
	url = https://github.com/qemu/u-boot.git
EOF
          fi
          
          # 同步子模块配置（递归处理所有嵌套子模块）
          git submodule sync --recursive
          
          # 重试3次拉取所有子模块（每次间隔5秒）
          for i in {1..3}; do
            echo "=== Attempt $i to pull all submodules ==="
            git submodule update --init --recursive --force && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
        shell: bash # 强制使用bash，兼容Windows/Linux

      # 步骤3：安装Linux依赖（仅Linux系统执行）
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          # QEMU编译依赖
          sudo apt install -y \
            gcc-arm-none-eabi \
            g++ \
            make \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libsdl2-dev \
            autoconf \
            automake \
            libtool \
            python3 \
            python3-pip

      # 步骤4：安装Windows依赖（仅Windows系统执行）
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # 安装Chocolatey包管理器（Windows）
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          # 安装编译依赖
          choco install -y \
            make \
            gcc-arm-none-eabi \
            msys2 \
            sdl2 \
            pkgconfiglite
          # 配置环境变量（修复msys2路径）
          echo "C:\msys64\usr\bin" >> $GITHUB_PATH
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\GNU Arm Embedded Toolchain\10 2021.10\bin" >> $GITHUB_PATH
        shell: powershell

      # 步骤5：配置并编译QEMU_STM32（修复Windows路径）
      - name: Configure and build qemu_stm32
        run: |
          # 再次使用GITHUB_WORKSPACE确保路径正确
          cd "$GITHUB_WORKSPACE" || exit 1
          
          # 创建构建目录（兼容Windows/Linux）
          mkdir -p build && cd build || exit 1
          
          # 配置（不同系统适配）
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            ../configure --target-list=arm-softmmu --enable-stm32 --disable-werror
          else
            # Windows下使用msys2的bash执行configure，指定完整路径
            bash -c "$GITHUB_WORKSPACE/configure --target-list=arm-softmmu --enable-stm32 --disable-werror"
          fi
          
          # 编译（多线程加速，Windows默认4线程）
          make -j$(nproc || echo 4)
        shell: bash

      # 步骤6：上传编译产物（方便下载使用）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu_stm32-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/build/arm-softmmu/qemu-system-arm*
            ${{ github.workspace }}/build/*.log
          retention-days: 7 # 产物保留7天
