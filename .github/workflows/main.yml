# 工作流名称
name: Cross-Platform Build (Windows & Linux)

# 触发条件：push到main分支、pull request到main分支、手动触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 手动触发

# 定义作业：同时在Windows和Linux上运行
jobs:
  build:
    # 运行的操作系统
    runs-on: ${{ matrix.os }}
    # 矩阵配置：指定要编译的系统
    strategy:
      fail-fast: false # 一个系统编译失败不影响另一个
      matrix:
        os: [ubuntu-20.04, windows-latest] # 匹配官方推荐的Ubuntu 20.04

    steps:
      # 步骤1：拉取代码到构建环境（禁用子模块拉取）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false # 完全禁用子模块拉取
          fetch-depth: 0    # 拉取完整提交历史

      # 步骤2：安装Linux依赖（严格匹配官方README的Ubuntu 20.04依赖）
      - name: Install dependencies (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          sudo apt update
          # 官方README指定的核心依赖
          sudo apt install -y \
            build-essential \
            python \
            zlib1g-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libtool \
            libfdt-dev \
            # 补充编译必需的工具（官方未列但实际需要）
            gcc-arm-none-eabi \
            g++ \
            make \
            pkg-config \
            autoconf \
            automake \
            python3
          # 校验依赖安装
          gcc --version
          make --version

      # 步骤3：安装Windows依赖（适配STM32编译需求）
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco upgrade chocolatey -y --no-progress
          choco install -y --no-progress `
            make `
            msys2 `
            sdl2 `
            pkgconfiglite `
            python `
            zlib `
            glib
          
          # 清华镜像源下载 ARM 交叉编译器（解决官方链接无法下载问题）
          $toolchainUrl = "https://mirrors.tuna.tsinghua.edu.cn/armbian-releases/tools/gcc-arm-none-eabi-10.3-2021.10-win32.zip"
          $toolchainZip = "$env:TEMP/gcc-arm-none-eabi.zip"
          $toolchainDir = "C:\gcc-arm-none-eabi"
          
          # 下载（超时时间60秒，避免卡壳）
          Invoke-WebRequest -Uri $toolchainUrl -OutFile $toolchainZip -UseBasicParsing -TimeoutSec 60
          # 解压
          Expand-Archive -Path $toolchainZip -DestinationPath $toolchainDir -Force
          # 配置环境变量
          $env:PATH += ";$toolchainDir\gcc-arm-none-eabi-10.3-2021.10-win32\bin;C:\msys64\usr\bin;C:\msys64\mingw64\bin"
          echo "$toolchainDir\gcc-arm-none-eabi-10.3-2021.10-win32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # 校验安装
          gcc-arm-none-eabi --version
          make --version
        shell: powershell

      # 步骤4：配置并编译QEMU_STM32（严格遵循官方README的编译命令）
      - name: Configure and build qemu_stm32
        run: |
          # 修复Windows路径转义问题，使用原生环境变量GITHUB_WORKSPACE
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          echo "Current workspace: $WORKSPACE_DIR"
          
          # 检查路径是否存在
          if [ ! -d "$WORKSPACE_DIR" ]; then
            echo "Error: Workspace directory $WORKSPACE_DIR does not exist!"
            exit 1
          fi
          
          # 进入源码根目录（兼容Windows/Linux）
          cd "$WORKSPACE_DIR" || exit 1
          
          # 执行官方推荐的configure命令：--enable-debug --disable-xen --disable-werror --target-list="arm-softmmu"
          if [[ "${{ matrix.os }}" == "ubuntu-20.04" ]]; then
            ./configure \
              --enable-debug \
              --disable-xen \
              --disable-werror \
              --target-list="arm-softmmu"
          else
            # Windows下使用msys2的bash执行configure，匹配官方参数
            bash -c "$GITHUB_WORKSPACE/configure --enable-debug --disable-xen --disable-werror --target-list='arm-softmmu'"
          fi
          
          # 官方推荐的make命令（多线程加速）
          make -j$(nproc || echo 4)
        shell: bash

      # 步骤5：可选-运行单元测试（匹配官方README的测试命令）
      - name: Run unit tests (Linux only)
        if: matrix.os == 'ubuntu-20.04' # Windows暂不支持QEMU单元测试
        run: |
          cd "$GITHUB_WORKSPACE" || exit 1
          # 官方README指定的单元测试命令
          make check
          make check-qtest-arm
        shell: bash

      # 步骤6：上传编译产物（适配根目录编译的产物路径）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu_stm32-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/arm-softmmu/qemu-system-arm*  # 官方指定的可执行文件路径
            ${{ github.workspace }}/*.log                       # 编译/测试日志
          retention-days: 7 # 产物保留7天
